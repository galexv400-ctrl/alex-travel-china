<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="China 2026">
<meta name="description" content="Alexandra's China & Bangkok 2026 trip">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>China & Bangkok 2026</title>
<!--
  This page has no trip content of its own. It renders the markdown files in
  travel/china-2026/ directly, so those files are the single source of truth.
  Edit the .md files — never this page — and the site updates.

  Presentation is derived from the markdown:
    ## heading            -> a card you can fold away
    - **10:30** ...        -> a timeline row (time in the left column)
    > ⚠ / 🚨 / ✅ ...       -> warning / critical / done callouts (others: info)
    headings and table rows with a date ("16 October", "Fri 16 Oct") are
    highlighted on that day, and dimmed once they are past.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --dark: #0f0a1e; --card: #1e1545; --card2: #171037; --accent: #a855f7; --gold: #7eb8f7;
    --text: #eaeaea; --muted: #a0a8c8; --line: #34285e;
    --warn: #f0a63a; --warn-bg: #2f2210; --ok: #3ccf7e; --ok-bg: #102a1e;
    --bad: #ff5d6c; --bad-bg: #36121a;
  }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 56px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--dark); color: var(--text); line-height: 1.55;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: linear-gradient(135deg, #2d1b69 0%, var(--dark) 100%);
    border-bottom: 2px solid var(--accent);
    padding: calc(18px + env(safe-area-inset-top)) 16px 14px;
  }
  header h1 { font-size: 1.3rem; }
  header p { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  #countdown { display: inline-block; margin-top: 8px; background: rgba(168,85,247,.18);
    border: 1px solid var(--accent); color: #fff; border-radius: 999px; padding: 3px 12px;
    font-size: .8rem; font-weight: 600; }
  #countdown:empty { display: none; }
  nav {
    position: sticky; top: 0; z-index: 5; background: var(--dark);
    border-bottom: 1px solid var(--line); display: flex; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  nav::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  nav button {
    flex: 0 0 auto; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: .9rem; padding: 12px 14px; cursor: pointer;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  #status { font-size: .75rem; color: var(--muted); padding: 8px 16px 0; }
  #status:empty { display: none; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 2px;
    scrollbar-width: none; max-width: 860px; margin: 0 auto; }
  .chip { flex: 0 0 auto; background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 5px 11px; font-size: .78rem; text-decoration: none; white-space: nowrap; }
  .chip.today { background: var(--accent); border-color: var(--accent); font-weight: 600; }

  main { padding: 4px 16px 48px; max-width: 860px; margin: 0 auto; }
  main h1 { font-size: 1.4rem; margin: 14px 0 10px; color: var(--gold); line-height: 1.25; }
  main h2 { font-size: 1.08rem; line-height: 1.3; }
  main h3 { font-size: .98rem; margin: 16px 0 6px; color: var(--gold); }
  main p, main ul, main ol { margin: 8px 0; }
  main ul, main ol { padding-left: 1.25em; }
  main li { margin: 3px 0; }
  main a { color: var(--gold); }
  main strong { color: #fff; }
  main em { color: #cfd3ea; }
  main code { background: var(--card); padding: 1px 5px; border-radius: 4px; font-size: .85em; }
  main hr { display: none; }

  /* Cards */
  .card { background: var(--card2); border: 1px solid var(--line); border-radius: 14px;
    margin: 14px 0; overflow: hidden; }
  .card > h2 { display: flex; align-items: center; gap: 8px; padding: 13px 14px;
    background: var(--card); cursor: pointer; user-select: none; }
  .card > h2 .title { flex: 1; }
  .card > h2 .caret { color: var(--muted); font-size: .8rem; transition: transform .15s; }
  .card.closed > h2 .caret { transform: rotate(-90deg); }
  .card > .body { padding: 4px 14px 12px; }
  .card.closed > .body { display: none; }
  .card.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.past > h2 { opacity: .55; }
  .badge { font-size: .65rem; font-weight: 700; letter-spacing: .04em; padding: 2px 7px;
    border-radius: 999px; background: var(--accent); color: #fff; }

  /* Timeline */
  ul.timeline { list-style: none; padding-left: 0; margin: 8px 0; position: relative; }
  ul.timeline > li { display: grid; grid-template-columns: 62px 1fr; gap: 10px; margin: 0;
    padding: 7px 0; border-bottom: 1px dashed rgba(52,40,94,.7); }
  ul.timeline > li:last-child { border-bottom: 0; }
  ul.timeline > li > .t { font-weight: 700; color: var(--gold); font-size: .82rem;
    font-variant-numeric: tabular-nums; padding-top: 1px; word-break: break-word; }
  ul.timeline > li > .b > ul { margin: 4px 0 0; }
  ul.timeline > li.plain { grid-template-columns: 1fr; }

  /* Callouts */
  main blockquote { background: var(--card); border-left: 3px solid var(--accent);
    padding: 9px 12px; margin: 10px 0; border-radius: 0 8px 8px 0; }
  main blockquote p { margin: 4px 0; }
  main blockquote.warn { background: var(--warn-bg); border-left-color: var(--warn); }
  main blockquote.ok   { background: var(--ok-bg);   border-left-color: var(--ok); }
  main blockquote.bad  { background: var(--bad-bg);  border-left-color: var(--bad); }

  /* Tables */
  .table-wrap { overflow-x: auto; margin: 10px 0; -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line); border-radius: 10px; }
  main table { border-collapse: collapse; font-size: .86rem; min-width: 100%; }
  main th, main td { padding: 7px 9px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--line); }
  main tr:last-child td { border-bottom: 0; }
  main th { background: var(--card); font-size: .78rem; color: var(--muted); font-weight: 600; }
  main th:empty { padding: 0; }
  main td:first-child { white-space: nowrap; }
  main tr.today td { background: rgba(168,85,247,.22); }
  main tr.past td { opacity: .5; }

  .err { background: var(--bad-bg); border: 1px solid var(--bad); padding: 12px; border-radius: 8px; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <h1>China & Bangkok 2026</h1>
  <p>15 Oct – 8 Nov · Bangkok · Hong Kong · China · Bangkok</p>
  <span id="countdown"></span>
</header>
<nav id="tabs"></nav>
<div id="status"></div>
<div class="chips" id="chips"></div>
<main id="content"></main>

<script src="lib/marked.min.js"></script>
<script>
  // Family view (?family): one page — where and when, nothing private.
  const FAMILY = new URLSearchParams(location.search).has('family');
  // Each tab is one markdown file. Add a file here and it becomes a tab.
  const DIR = FAMILY ? 'family/' : 'travel/china-2026/';
  const TABS = FAMILY ? [{ id: 'family', label: 'Where is Alexandra?', file: 'where-alexandra-is.md' }] : [
    { id: 'plan',     label: 'Overview',   file: 'full-trip-plan.md' },
    { id: 'hk',       label: 'Hong Kong',  file: 'hong-kong-itinerary.md' },
    { id: 'bkk',      label: 'Bangkok',    file: 'bangkok-itinerary.md' },
    { id: 'outfits',  label: 'Outfits',    file: 'outfit-plan.md' },
    { id: 'packing',  label: 'Packing',    file: 'packing-list.md' },
    { id: 'meds',     label: 'Medication', file: 'medication-guide.md' },
    { id: 'intrepid', label: 'Tour',       file: 'intrepid-trip-notes.md' },
  ];
  const YEAR = 2026;
  const DEPART     = new Date(YEAR, 9, 14);   // 14 Oct, Ben Gurion — the countdown
  const TRIP_START = new Date(YEAR, 9, 15);   // 15 Oct
  const TRIP_END   = new Date(YEAR, 10, 8);   // 8 Nov

  marked.setOptions({ gfm: true, breaks: true });

  const nav = document.getElementById('tabs');
  const content = document.getElementById('content');
  const status = document.getElementById('status');
  const chips = document.getElementById('chips');

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const DAY = 864e5;

  // ---------- Countdown ----------
  (function countdown() {
    const el = document.getElementById('countdown');
    const n = Math.round((DEPART - today) / DAY);
    if (n > 1) el.textContent = n + ' days to go';
    else if (n === 1) el.textContent = 'Ben Gurion tomorrow';
    else if (n === 0) el.textContent = 'Today · Ben Gurion by 22:15';
    else if (today <= TRIP_END) el.textContent = 'Day ' + (Math.round((today - TRIP_START) / DAY) + 1) + ' of 25';
    else el.textContent = 'Welcome home';
  })();

  // ---------- Dates found in headings and table rows ----------
  const MONTHS = { oct: 9, october: 9, nov: 10, november: 10 };
  function findDate(text) {
    const m = text.match(/\b(\d{1,2})\s+(Oct(?:ober)?|Nov(?:ember)?)\b/i);
    if (!m) return null;
    return new Date(YEAR, MONTHS[m[2].toLowerCase()], +m[1]);
  }
  const sameDay = (a, b) => a.getTime() === b.getTime();

  // ---------- Enhance the rendered markdown ----------
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40); }

  function buildCards(root) {
    const kids = [...root.children];
    const out = document.createDocumentFragment();
    let body = null;
    for (const el of kids) {
      if (el.tagName === 'H2') {
        const card = document.createElement('section');
        card.className = 'card';
        card.id = slug(el.textContent) || 'section';
        const h = document.createElement('h2');
        h.innerHTML = '<span class="title">' + el.innerHTML + '</span><span class="caret">▾</span>';
        h.onclick = () => card.classList.toggle('closed');
        body = document.createElement('div');
        body.className = 'body';
        card.append(h, body);
        out.appendChild(card);
        const d = findDate(el.textContent);
        if (d) {
          if (sameDay(d, today)) {
            card.classList.add('today');
            h.querySelector('.title').insertAdjacentHTML('afterend', '<span class="badge">TODAY</span>');
          } else if (d < today) {
            card.classList.add('past', 'closed');
          }
        }
      } else if (body) {
        body.appendChild(el);
      } else {
        out.appendChild(el);
      }
    }
    root.innerHTML = '';
    root.appendChild(out);
  }

  const TIME_RE = /^(~?\d{1,2}:\d{2}(\s*[–-]\s*\d{1,2}:\d{2})?|Morning|Evening|Afternoon|Breakfast|(Mon|Tue|Wed|Thu|Fri|Sat|Sun) \d{1,2} (Oct|Nov),? ?\d{1,2}:\d{2})$/;
  function buildTimelines(root) {
    root.querySelectorAll('ul').forEach(ul => {
      if (ul.parentElement.closest('li')) return;           // top-level lists only
      const items = [...ul.children];
      const timed = items.filter(li => {
        const first = li.firstElementChild;
        return first && first.tagName === 'STRONG' && li.firstChild === first &&
               TIME_RE.test(first.textContent.trim());
      });
      if (timed.length < 2 || timed.length < items.length / 2) return;
      ul.classList.add('timeline');
      items.forEach(li => {
        const first = li.firstElementChild;
        const t = document.createElement('span'); t.className = 't';
        const b = document.createElement('div'); b.className = 'b';
        if (timed.includes(li)) { t.textContent = first.textContent.trim(); first.remove(); }
        while (li.firstChild) b.appendChild(li.firstChild);
        if (b.firstChild && b.firstChild.nodeType === 3) b.firstChild.textContent = b.firstChild.textContent.replace(/^\s*[·—-]?\s*/, '');
        li.append(t, b);
      });
    });
  }

  function styleCallouts(root) {
    root.querySelectorAll('blockquote').forEach(q => {
      const s = q.textContent.trim();
      if (s.startsWith('🚨')) q.classList.add('bad');
      else if (s.startsWith('⚠')) q.classList.add('warn');
      else if (s.startsWith('✅')) q.classList.add('ok');
    });
  }

  function markTableRows(root) {
    root.querySelectorAll('tbody tr').forEach(tr => {
      const cell = tr.querySelector('td');
      const d = cell && findDate(cell.textContent);
      if (!d) return;
      if (sameDay(d, today)) tr.classList.add('today');
      else if (d < today && today >= TRIP_START) tr.classList.add('past');
    });
  }

  function buildChips(root) {
    chips.innerHTML = '';
    const cards = [...root.querySelectorAll('.card')];
    const todayCard = root.querySelector('.card.today');
    if (todayCard) chips.insertAdjacentHTML('beforeend', '<a class="chip today" href="#" data-to="' + todayCard.id + '">Today</a>');
    if (cards.length >= 3) cards.forEach(c => {
      const label = c.querySelector('h2 .title').textContent.replace(/[—:·].*$/, '').trim();
      chips.insertAdjacentHTML('beforeend', '<a class="chip" href="#" data-to="' + c.id + '"></a>');
      chips.lastChild.textContent = label;
    });
    chips.querySelectorAll('a').forEach(a => a.onclick = e => {
      e.preventDefault();
      const c = document.getElementById(a.dataset.to);
      c.classList.remove('closed');
      c.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // ---------- Tabs ----------
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.id = t.id;
    b.onclick = () => { location.hash = t.id; };
    nav.appendChild(b);
  });

  async function show(id) {
    const tab = TABS.find(t => t.id === id) || TABS[0];
    [...nav.children].forEach(b => b.classList.toggle('on', b.dataset.id === tab.id));
    nav.querySelector('.on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
    content.innerHTML = ''; chips.innerHTML = '';
    try {
      const res = await fetch(DIR + tab.file);
      if (!res.ok) throw new Error(res.status);
      // '~' means 'approximately' in these files, never strikethrough — escape it
      const md = (await res.text()).replace(/~/g, '\\~');
      content.innerHTML = marked.parse(md);
      content.querySelectorAll('table').forEach(tbl => {
        const w = document.createElement('div');
        w.className = 'table-wrap';
        tbl.replaceWith(w);
        w.appendChild(tbl);
      });
      content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
      buildTimelines(content);
      styleCallouts(content);
      markTableRows(content);
      buildCards(content);
      buildChips(content);
      status.textContent = navigator.onLine ? '' : 'Offline — showing the last saved copy';
      window.scrollTo(0, 0);
    } catch (e) {
      content.innerHTML = '<div class="err">Could not load <strong>' + tab.file +
        '</strong>. If you are offline, open this tab once while online so it is saved for later.</div>';
    }
  }

  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));

  if (FAMILY) { nav.style.display = 'none'; document.querySelector('header h1').textContent = 'Where is Alexandra?'; }
  if (!FAMILY && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="China 2026">
<meta name="description" content="Alexandra's China & Bangkok 2026 trip">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>China & Bangkok 2026</title>
<!--
  This page has no trip content of its own. It renders the markdown files in
  travel/china-2026/ directly, so those files are the single source of truth.
  Edit the .md files — never this page — and the site updates.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --dark: #0f0a1e; --card: #1e1545; --accent: #a855f7; --gold: #7eb8f7;
    --text: #eaeaea; --muted: #a0a8c8; --line: #34285e;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--dark); color: var(--text); line-height: 1.55;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: linear-gradient(135deg, #2d1b69 0%, var(--dark) 100%);
    border-bottom: 2px solid var(--accent);
    padding: calc(18px + env(safe-area-inset-top)) 16px 14px;
  }
  header h1 { font-size: 1.3rem; }
  header p { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  nav {
    position: sticky; top: 0; z-index: 5; background: var(--dark);
    border-bottom: 1px solid var(--line); display: flex; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: 0 0 auto; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: .9rem; padding: 12px 14px; cursor: pointer;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  #status { font-size: .75rem; color: var(--muted); padding: 8px 16px 0; }
  main { padding: 8px 16px 48px; max-width: 860px; margin: 0 auto; }
  main h1 { font-size: 1.35rem; margin: 18px 0 8px; color: var(--gold); }
  main h2 { font-size: 1.15rem; margin: 26px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  main h3 { font-size: 1rem; margin: 18px 0 6px; color: var(--gold); }
  main p, main ul, main ol { margin: 8px 0; }
  main ul, main ol { padding-left: 1.3em; }
  main li { margin: 3px 0; }
  main a { color: var(--gold); }
  main strong { color: #fff; }
  main code { background: var(--card); padding: 1px 5px; border-radius: 4px; font-size: .85em; }
  main hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
  main blockquote {
    background: var(--card); border-left: 3px solid var(--accent);
    padding: 8px 12px; margin: 10px 0; border-radius: 0 6px 6px 0;
  }
  main blockquote p { margin: 4px 0; }
  .table-wrap { overflow-x: auto; margin: 10px 0; -webkit-overflow-scrolling: touch; }
  main table { border-collapse: collapse; font-size: .88rem; min-width: 100%; }
  main th, main td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  main th { background: var(--card); }
  .err { background: #3a1420; border: 1px solid #c0392b; padding: 12px; border-radius: 6px; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <h1>China & Bangkok 2026</h1>
  <p>15 Oct – 8 Nov · Bangkok · Hong Kong · China · Bangkok</p>
</header>
<nav id="tabs"></nav>
<div id="status"></div>
<main id="content"></main>

<script src="lib/marked.min.js"></script>
<script>
  // Each tab is one markdown file. Add a file here and it becomes a tab.
  const DIR = 'travel/china-2026/';
  const TABS = [
    { id: 'plan',     label: 'Overview',   file: 'full-trip-plan.md' },
    { id: 'hk',       label: 'Hong Kong',  file: 'hong-kong-itinerary.md' },
    { id: 'bkk',      label: 'Bangkok',    file: 'bangkok-itinerary.md' },
    { id: 'outfits',  label: 'Outfits',    file: 'outfit-plan.md' },
    { id: 'packing',  label: 'Packing',    file: 'packing-list.md' },
    { id: 'meds',     label: 'Medication', file: 'medication-guide.md' },
    { id: 'intrepid', label: 'Intrepid',   file: 'intrepid-trip-notes.md' },
  ];

  marked.setOptions({ gfm: true, breaks: true });

  const nav = document.getElementById('tabs');
  const content = document.getElementById('content');
  const status = document.getElementById('status');

  TABS.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.id = t.id;
    b.onclick = () => { location.hash = t.id; };
    nav.appendChild(b);
  });

  async function show(id) {
    const tab = TABS.find(t => t.id === id) || TABS[0];
    [...nav.children].forEach(b => b.classList.toggle('on', b.dataset.id === tab.id));
    nav.querySelector('.on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
    content.innerHTML = '';
    try {
      const res = await fetch(DIR + tab.file);
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      content.innerHTML = marked.parse(md);
      content.querySelectorAll('table').forEach(tbl => {
        const w = document.createElement('div');
        w.className = 'table-wrap';
        tbl.replaceWith(w);
        w.appendChild(tbl);
      });
      content.querySelectorAll('a[href^="http"]').forEach(a => {
        a.target = '_blank'; a.rel = 'noopener';
      });
      status.textContent = navigator.onLine ? '' : 'Offline — showing the last saved copy';
      window.scrollTo(0, 0);
    } catch (e) {
      content.innerHTML = '<div class="err">Could not load <strong>' + tab.file +
        '</strong>. If you are offline, open this tab once while online so it is saved for later.</div>';
    }
  }

  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
